name: Smoke

# Post-deploy smoke test (Phase 10, O3): pages, catalog sizes + sha256, a
# parquet Range read, and one browser check. Needs no secrets.
#
# Called by deploy.yml after each Cloudflare deploy (on Vercel it ran on the
# deployment_status event, which Workers does not send). Run it by hand
# against any URL: Actions → Smoke → Run workflow, or locally
# `scripts/smoke/run.sh <url>`.

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to smoke-test"
        required: true
        default: "https://energymap.marain.space"

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.url }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: HTTP checks (pages, catalog sizes + sha256, parquet Range)
        id: http
        env:
          URL: ${{ inputs.url }}
        run: node scripts/smoke/smoke.mjs "$URL"

      - uses: pnpm/action-setup@v4
        if: steps.http.outputs.skipped != 'true'
        with:
          version: 10

      - name: Install Playwright
        if: steps.http.outputs.skipped != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Browser check (data-ready + basemap tile)
        if: steps.http.outputs.skipped != 'true'
        env:
          SMOKE_URL: ${{ inputs.url }}
          CI: "1"
        run: pnpm exec playwright test -c scripts/smoke/playwright.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: test-results/smoke/
          retention-days: 7
